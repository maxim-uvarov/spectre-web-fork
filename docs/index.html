:root {
    color-scheme: light dark;
    --accent: #3E8989;
}

body {
    max-width: 30rem;
    margin: 0 auto;
    padding: 1rem;
    font: 18px/1.4 system-ui, sans-serif;
}

h1 {
    margin: 0 0 0.25rem;
    font-size: 1.4rem;
}

header p, footer p {
    margin: 0 0 1rem;
    font-size: 0.85rem;
    opacity: 0.75;
}

[hidden] {
    display: none !important;
}

form {
    display: grid;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
}

label {
    display: grid;
    gap: 0.25rem;
}

.row {
    display: flex;
    gap: 0.75rem;
}

.row > label {
    flex: 1;
}

input, select, button, output {
    box-sizing: border-box;
    width: 100%;
    padding: 0.6rem 0.8rem;
    font: inherit;
    border: 1px solid #888;
    border-radius: 0.5rem;
    background: transparent;
    color: inherit;
}

button {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
}

#signout {
    background: transparent;
    color: inherit;
    border-color: #888;
}

fieldset {
    display: flex;
    gap: 0.5rem;
    margin: 0;
    padding: 0;
    border: 0;
}

fieldset label {
    flex: 1;
    display: block;
    padding: 0.6rem 0;
    text-align: center;
    border: 1px solid #888;
    border-radius: 0.5rem;
}

fieldset input {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
}

fieldset label:has(:checked) {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
}

#identity {
    margin: 0;
}

output {
    display: block;
    min-height: 3rem;
    font-family: ui-monospace, monospace;
    font-size: 22px;
    word-break: break-all;
    user-select: all;
}

.error {
    margin: 0;
    color: #c33;
}

.error:empty {
    display: none;
}

        <header>
            <h1>Spectre Web fork</h1>
            <p>A modified fork of the Spectre 3.0-alpha.2 web app, changed in 2026. Not the official Spectre. <a href="https://github.com/maxim-uvarov/spectre-web-fork">Source code</a>.</p>
        </header>

        <main>
            <form id="user">
                <label>Full name
                    <input id="userName" type="text" autocomplete="off" autocapitalize="words">
                </label>
                <label>Spectre secret
                    <input id="userSecret" type="password" autocomplete="off">
                </label>
                <label>Algorithm version
                    <select id="algorithmVersion"></select>
                </label>
                <p id="userError" class="error"></p>
                <button type="submit">Sign in</button>
            </form>

            <form id="site" hidden>
                <p id="identity"></p>
                <label>Site
                    <input id="siteName" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="url">
                </label>
                <fieldset>
                    <label><input type="radio" name="sitePurpose" value="com.lyndir.masterpassword" checked>Password</label>
                    <label><input type="radio" name="sitePurpose" value="com.lyndir.masterpassword.login">Login name</label>
                    <label><input type="radio" name="sitePurpose" value="com.lyndir.masterpassword.answer">Security answer</label>
                </fieldset>
                <div class="row">
                    <label>Counter
                        <input id="siteCounter" type="number" min="1" max="100" value="1" inputmode="numeric">
                    </label>
                    <label>Type
                        <select id="siteType"></select>
                    </label>
                </div>
                <output id="siteResult"></output>
                <p id="siteError" class="error"></p>
                <button type="submit" id="copy">Copy</button>
                <button type="button" id="signout">Sign out</button>
            </form>
        </main>

        <footer>
            <p>Based on <a href="https://spectre.app/">Spectre</a>, Copyright © 2011 <a href="https://lhunath.com">Maarten Billemont</a>. Modified 2026. Everything stays on this device.</p>

    /** (2012-07-17) V1 incorrectly sized site name fields by character count rather than byte count. */
    v1: 1,
    /** (2014-09-24) V2 incorrectly sized user name fields by character count rather than byte count. */
    v2: 2,
    /** (2015-01-15) V3 is the current version. */
    v3: 3,

spectre.algorithm = Object.freeze({
    ...spectre.algorithm,
    current: spectre.algorithm.v3,
    first: spectre.algorithm.v0,
    last: spectre.algorithm.v3,
});
spectre.purpose = Object.freeze({
    /** Generate a key for authentication. */
    authentication: "com.lyndir.masterpassword",
    /** Generate a name for identification. */

    /** Generate a recovery token. */
    recovery: "com.lyndir.masterpassword.answer",
});
spectre.class = Object.freeze({
    /** Use the site key to generate a result from a template. */

    derive: 1 << 6,

    alternate: 1 << 12,

    /** 17: BiroYena8:Kixa */

    /** 18: BirSuj0- */

    /** 19: Bir8 */

    /** 21: 2798 */
    templatePIN: 0x5 | spectre.class.template | spectre.feature.none,
    /** 30: birsujano */

    /** 31: bir yennoquce fefi */
    templatePhrase: 0xF | spectre.class.template | spectre.feature.none,

    /** 1056: Custom saved result. */
    statePersonal: 0x0 | spectre.class.stateful | spectre.feature.exportContent,
    /** 2081: Custom saved result that should not be exported from the device. */
    stateDevice: 0x1 | spectre.class.stateful | spectre.feature.devicePrivate,

    deriveKey: 0x0 | spectre.class.derive | spectre.feature.alternate,

    [spectre.resultType.templateLong]: "Long",
    [spectre.resultType.templateMedium]: "Medium",
    [spectre.resultType.templateShort]: "Short",
    [spectre.resultType.templateBasic]: "Basic",
    [spectre.resultType.templatePIN]: "PIN",

    [spectre.resultType.statePersonal]: "Own",
    [spectre.resultType.stateDevice]: "Device",
    [spectre.resultType.deriveKey]: "Key",
});
spectre.counter = {
    /** Use a time-based counter value, resulting in a TOTP generator. */
    TOTP: 0,
    /** The initial value for a site's counter. */
    initial: 1,
};
spectre.counter = Object.freeze({
    ...spectre.counter,
    default: spectre.counter.initial,
    first: spectre.counter.TOTP,
    last: 4294967295,
});
spectre.templates = Object.freeze({

    ],

/**
 * spectre-service
 * ===============
 *
 * This file is responsible for providing a Spectre service which operates through a background Spectre web worker.
 * The service manages a single internal Spectre user identity through requested operations.
 *
 * It attaches the following properties to the global `spectre` object:
 * `userName`, `identicon`, `authenticated` & `site`: They describe the current state of the Spectre identity managed through the service.
 * It attaches the following functions to the global `spectre` object:
 * `invalidate`, `authenticate`, `password`, `login` & `answer`: They operate on the Spectre identity managed through the service.
 */

spectre.observers = [];
spectre.operations = {
    user: {
        pending: false,
        error: null,
        cause: null,
        userName: null,
        identicon: null,
        authenticated: false,
    },
    site: {
        pending: false,
        error: null,
        cause: null,
        result: [],
    }
};

spectre.invalidate = Object.freeze(() => {
    spectre.operations.user.pending = true;
    spectre.operations.site.pending = true;
    for (const observer of spectre.observers) {
        observer()
    }

    spectre.worker.postMessage({
        "userName": spectre.operations.user.userName,
        "invalidate": true,
    });
});
spectre.authenticate = Object.freeze((userName, userSecret, algorithmVersion) => {
    spectre.operations.user.pending = true;
    spectre.operations.user.userName = userName;
    for (const observer of spectre.observers) {
        observer()
    }

    spectre.worker.postMessage({
        "userName": userName,
        "userSecret": userSecret,
        "algorithmVersion": algorithmVersion,
    });
});
spectre.password = Object.freeze((siteName, resultType, keyCounter, keyContext) => {
    spectre.request(siteName, resultType, keyCounter, spectre.purpose.authentication, keyContext);
});
spectre.login = Object.freeze((siteName, resultType, keyCounter, keyContext) => {
    spectre.request(siteName, resultType, keyCounter, spectre.purpose.identification, keyContext);
});
spectre.answer = Object.freeze((siteName, resultType, keyCounter, keyContext) => {
    spectre.request(siteName, resultType, keyCounter, spectre.purpose.recovery, keyContext);
});
spectre.request = Object.freeze((siteName, resultType, keyCounter, keyPurpose, keyContext) => {
    spectre.operations.site.pending = true;
    for (const observer of spectre.observers) {
        observer()
    }

    spectre.worker.postMessage({
        "userName": spectre.operations.user.userName,
        "siteName": siteName,
        "resultType": resultType,
        "keyCounter": keyCounter,
        "keyPurpose": keyPurpose,
        "keyContext": keyContext,
    });
});
spectre.result = Object.freeze((siteName, keyPurpose = spectre.purpose.authentication, keyContext = null) => {
    return ((spectre.operations.site.result[siteName || ""] || {})[keyPurpose || ""] || {})[keyContext || ""]
});

function newWorkerFromURL(workerURL) {
    let blobURL = URL.createObjectURL(new Blob([
        'let baseURI = ', JSON.stringify(document.baseURI), '; ' +
        'importScripts(new URL(', JSON.stringify(workerURL), ', baseURI).href)',
    ], {type: 'application/javascript'}));

    try {
        return new Worker(blobURL);
    } finally {
        URL.revokeObjectURL(blobURL);
    }
}

function mergeInto(host, ...objects) {
    if (!objects.length)
        return host;

    const object = objects.shift();
    for (const key in object) {
        let item = object[key]
        if (item && typeof item === 'object' && !Array.isArray(item) && host[key]) {
            mergeInto(host[key], item);
        } else {
            Object.assign(host, { [key]: item });
        }
    }

    return mergeInto(host, ...objects);

            spectre.operations.user.cause = null;

        <script>const userForm = document.getElementById("user");
const userName = document.getElementById("userName");
const userSecret = document.getElementById("userSecret");
const algorithmVersion = document.getElementById("algorithmVersion");
const userError = document.getElementById("userError");
const siteForm = document.getElementById("site");
const identity = document.getElementById("identity");
const siteName = document.getElementById("siteName");
const siteCounter = document.getElementById("siteCounter");
const siteType = document.getElementById("siteType");
const siteResult = document.getElementById("siteResult");
const siteError = document.getElementById("siteError");
const copyButton = document.getElementById("copy");
const signOutButton = document.getElementById("signout");

for (let version = spectre.algorithm.first; version <= spectre.algorithm.last; version++) {
    algorithmVersion.add(new Option(`V${version}`, version));
}
for (const template in spectre.templates) {
    siteType.add(new Option(spectre.resultName[template], template));
}

function purpose() {
    return siteForm.elements.sitePurpose.value;
}

function updateDefaults() {
    algorithmVersion.value = spectre.algorithm.current;
    siteCounter.value = spectre.counter.initial;
    switch (purpose()) {
        case spectre.purpose.authentication:
            siteType.value = spectre.resultType.defaultPassword;
            break;
        case spectre.purpose.identification:
            siteType.value = spectre.resultType.defaultLogin;
            break;
        case spectre.purpose.recovery:
            siteType.value = spectre.resultType.defaultAnswer;
            break;
    }
}

function updateSpectre() {
    spectre.request(siteName.value, siteType.value, siteCounter.value, purpose(), null);
}

// The identicon is the check that the secret was typed right: it is derived
// from name and secret, so a typo shows a different figure.
function identicon(icon) {
    return icon ? [icon.leftArm, icon.body, icon.rightArm, icon.accessory].join("") : "";
}

function updateView() {
    const user = spectre.operations.user;
    const site = spectre.operations.site;
    const signedIn = user.authenticated;

    userForm.hidden = signedIn;
    siteForm.hidden = !signedIn;
    userError.textContent = user.error || "";
    siteError.textContent = site.error || "";
    userSecret.value = "";

    if (signedIn) {
        identity.textContent = `${user.userName} ${identicon(user.identicon)}`;
        siteResult.value = spectre.result(siteName.value, purpose()) || (site.pending ? "…" : "");
    } else {
        userName.value = user.userName || "";
        siteName.value = "";
        siteResult.value = "";
    }
}

updateDefaults();
spectre.observers.push(updateView);
updateView();

userForm.addEventListener("submit", (event) => {
    event.preventDefault();
    spectre.authenticate(userName.value, userSecret.value, algorithmVersion.value);
});
siteForm.addEventListener("submit", (event) => {
    event.preventDefault();
    navigator.clipboard.writeText(siteResult.value).then(() => {
        copyButton.textContent = "Copied";
        setTimeout(() => { copyButton.textContent = "Copy"; }, 1000);
    });
});
signOutButton.addEventListener("click", () => {
    spectre.invalidate();
});
siteName.addEventListener("input", updateSpectre);
siteCounter.addEventListener("input", updateSpectre);
siteType.addEventListener("input", updateSpectre);
siteForm.elements.sitePurpose.forEach((radio) => radio.addEventListener("input", () => {
    updateDefaults();
    updateSpectre();
}));

if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
}
</script>
