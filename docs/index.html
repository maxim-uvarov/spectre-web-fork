        <style media="screen">/*=================================================================
  Standard Elements
 *================================================================*/

:root {
    color-scheme: dark;

    --body-fill-rgb: 14, 51, 69;
    --body-contrast-rgb: 18, 55, 73;
    --panel-fill-rgb: 23, 61, 80;
    --body-fill: /* #0E3345 */ rgb(var(--body-fill-rgb));
    --body-contrast: #123749;
    --body-text: #C0C8CF;
    --body-focus: #41A0A0;

    --panel-fill: #173D50;
    --panel-contrast-rgb: 42, 73, 89;
    --panel-contrast: /* #2A4959 */ rgb(var(--panel-contrast-rgb));

    --shadow: rgba(0, 0, 0, 0.1);
    --highlight: rgba(255, 255, 255, 0.1);

    --control-text: #000000;
    --control-fill: #3E8989;
    --control-contrast: #57CBCC;

    --active-text: #F6FFFF;

    --internal-size: 4px;
    --join-size: 8px;
    --pair-size: 12px;
    --group-size: 20px;
    --break-size: 40px;
}

body {
    font: 400 1em/1.4 system-ui, sans-serif;

    -webkit-font-smoothing: antialiased;
    color: var(--body-text);
    background: var(--body-fill);
    background: radial-gradient(circle at 50% 50%, var(--panel-fill), var(--body-fill));
}

h1, h2, h3, h4, h5, h6 {
    position: relative;
    font: 1em system-ui, sans-serif;

    color: var(--active-text);
    text-shadow: 2px 2px var(--body-fill);
}

h1:target, h2:target, h3:target, h4:target, h5:target, h6:target {
    font-weight: bold;
}

h1:target::before, h2:target::before, h3:target::before, h4:target::before, h5:target::before, h6:target::before {
    content: "";
    position: absolute;
    display: flex;
    align-items: center;
    height: 100%;
    margin-left: -1.5em;
    font-family: "Font Awesome 6 Free", monospace;
    color: var(--active-text);
}

h1 {
    margin-bottom: 0.5em;
    font-size: 1.2em;
    font-variant: all-small-caps;

    color: var(--body-focus);
}

h1 a {
    text-decoration: underline;
    color: inherit;
}

h1:focus a, h1:hover a {
    color: var(--active-text);
}

h2 {
    margin-bottom: 1em;
    font-size: 2.4em;
    text-align: center;
}

h3 {
    font-size: 1.5em;
    text-align: center;
}

h2 + h3 {
    margin-top: -1.5em;
    margin-bottom: 1.5em;
}

h4 {
    font-size: 1em;
}

h5 {
    font: 200 80%/1.2 system-ui, sans-serif;

    color: inherit;
}

a, a:focus, a:hover {
    color: var(--body-focus);
}

a {
    text-decoration: none;
    color: var(--active-text);
}

hr {
    clear: both;
    flex-basis: 100%;
    height: 1px;
    margin: 1em auto;
    opacity: 1;
    border: none;
    background: var(--highlight);
}

label {
    margin: 0 1ex;
    vertical-align: middle;

    font: 300 1em system-ui, sans-serif;

    color: var(--body-text);
}

label:focus-within {
    color: var(--active-text);
}

/*form label:before {*/
/*    content: "";*/
/*    display: inline-block;*/
/*    width: 1.5em;*/
/*    text-align: end;*/
/*}*/

form label {
    display: block;
    width: auto;
    font-size: smaller;
    text-align: start;
}

form input, form textarea, form select, form button {
    overflow: hidden;
    margin: 0.2em 0;
    font-size: larger;
    background: rgba(var(--body-fill-rgb), 0.9);
}

form button {
    width: 100%;
    border-radius: var(--internal-size);
    background: var(--control-contrast);
}

form button:hover {
    background: var(--body-focus);
}

input, textarea, select, button, a.btn, input[type=radio]+label {
    width: 100%;
    padding: 0.5em 1em;
    letter-spacing: 1px;

    color: var(--active-text);
    border: 1px solid rgba(236, 239, 241, 0.07);
    border-radius: var(--internal-size);
    background: transparent;
    box-shadow: 0 0 8px var(--shadow);
}

button input[readonly] {
    width: calc(100% - 3ex);
    padding: 0;
    border: none;
    border-radius: 0;
    background: transparent;
    box-shadow: none;
}

input::placeholder, textarea::placeholder {
    color: var(--body-text);
}

input:hover, textarea:hover, select:hover {
    border-color: var(--control-contrast);
    background: rgba(var(--panel-fill-rgb), 0.9);
}

textarea {
    height: 6em;
}

select * {
    background: var(--body-contrast);
}

button, a.btn {
    display: inline-block;
    width: auto;

    font-size: 1em;
    color: var(--control-text);

    border: 2px solid transparent;
    border-radius: var(--group-size);
    background: var(--control-fill);
}

button, a.btn, button *, a.btn * {
    cursor: pointer;
}

button:hover, a.btn:hover {
    color: var(--active-text);
    background: var(--body-focus);
}

section:target .cta {
    border-color: var(--control-contrast) !important;
}

input, textarea, select, button, a, label, :target, :focus, :hover, :active {
    outline: none;
    transition: all .38s ease-in 0s;
}

input[type=checkbox] {
    width: initial;
}

input[type=radio] {
    display: none;
}
input[type=radio]+label {
    display: inline;
    background: var(--control-fill);
}
input[type=radio]:checked+label {
    font-weight: bold;
    background: var(--control-contrast);
}

li input[type=checkbox] {
    margin-left: -1em;
}

blockquote {
    padding: 1em;
    color: var(--active-text);
    border-left: 1ex solid var(--panel-contrast);
    border-radius: var(--internal-size);
    background: var(--panel-fill);
}

*:last-child {
    margin-bottom: 0;
}

*:first-child {
    margin-top: 0;
}

.row {
    row-gap: 1em;
}

h1 blockquote, h2 blockquote, h3 blockquote {
    display: inline-block;
    padding: 0.2em 1em;
    border-color: initial;
    border-left-width: 0.2ex;
}

strong, b, em {
    color: var(--active-text);
    /*background: var(--highlight);*/
    /*border-radius: var(--internal-size);*/
    /*padding: 1px 2px;*/
    /*border-bottom: 1px dotted var(--body-focus);*/
}

table {
    min-width: 62%;
    margin: 1.5em auto;
    padding: 1ex;
    border-collapse: separate;
    color: var(--active-text);
    border: 1px solid var(--panel-contrast);
    border-radius: var(--join-size);
    background: var(--panel-fill);
}

table th, table td {
    padding: 0.5em 1ex;
}

table tbody tr:nth-child(2n+1) {
    background: var(--panel-contrast);
}

section {
    position: relative;
    overflow: hidden;
    padding: 6em 0;
}

section.lit {
    background-color: var(--body-contrast);
}

@media (max-width: 768px) {
    section {
        padding: 4em 0;
    }
}

@media (max-width: 576px) {
    .box {
        padding: 1em;
    }
}

aside {
    position: relative;
    z-index: 1;
    display: flex;
    float: right;
    align-content: center;
    flex-direction: column;
    justify-content: center;
    padding: 1em;
    gap: 1em;
}

aside .btn {
    text-align: initial;
}

aside .btn i {
    width: 3em;
    height: 3em;
    vertical-align: middle;
}

iframe {
    display: block;
    width: 100%;
    margin: auto;
    border: 0 solid var(--panel-contrast);
    color-scheme: initial;
}

#content > iframe {
    height: 80vh;
    border-width: 1px 0;
}

/*=================================================================
  Behaviour
 *================================================================*/

[scroll-behavior=smooth] {
    scroll-behavior: smooth;
}


::-moz-selection, ::selection {
    color: var(--active-text);
    background: var(--control-contrast);
}

/*=================================================================
  Utilities
 *================================================================*/

html:not([data-os="Windows"]) .os-windows,
html:not([data-os="Mac OS"]) .os-macos,
html:not([data-os="Linux"]) .os-linux,
html:not([data-os="iOS"]) .os-ios,
html:not([data-os="Android"]) .os-android {
    display: none !important;
}

a.btn-transparent {
    color: var(--active-text);
    border: 1px solid var(--control-fill);
    background: transparent;
}

a.btn-transparent:hover,
a.btn-transparent:focus {
    border: 1px solid transparent;
    background: var(--control-fill);
}

.code {
    font-family: ui-monospace, monospace;
}

.info, .error {
    font-weight: 500;
    border-radius: var(--internal-size);
}

p.info, p.error {
    padding: 0.2em;
    text-align: center;
}

.info:empty, .error:empty {
    display: none;
}

.info, .safe {
    color: #198754;
}

p.info {
    background: #0C4128;
}

.error, .notice {
    color: #FFECB5;
}

.error, .severe {
    color: #BB2D3B;
}

p.error {
    background: #6A1A21;
}

.flex {
    display: flex;
    justify-content: center;
    margin: 1em auto;
    gap: 1em;
}

.box {
    position: relative;
    overflow: hidden;
    margin: 0 auto;
    padding: 2em;
    border-radius: var(--join-size);
    background: rgba(var(--panel-fill-rgb), 0.9);
    box-shadow: 0 0 var(--join-size) var(--shadow);
    transition: all .38s ease-in 0s;
}

.box::before {
    content: "";
    position: absolute;
    z-index: -1;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    background: var(--bg) var(--panel-fill) no-repeat center/cover;
}

label.box:hover, label.box[checked] {
    background: rgba(var(--panel-fill-rgb), 0.6);
}

@media (max-width: 576px) {
    .box {
        padding: 1em;
    }
}

.box p.error, .box p.info {
    position: absolute;
    right: 0;
    top: 0;
    left: 0;
    margin: 0.5em;
    font-size: smaller;
    color: var(--active-text);
    background: var(--body-fill);
}

.box > hr {
    width: 38%;
}

.box > i {
    display: block;
    margin: 0 auto 0;
    font-size: 3em;
    color: var(--control-contrast);
}

.box > i.fa-xs {
    font-size: 0.75em;
    line-height: 1.2;
}

.box > h3, .box > h4 {
    text-align: center;
}

.box input {
    padding: 0.5em 1.5em;
    border: none;
    border-radius: var(--group-size);
    background: var(--highlight);
}

.box input.lit {
    background-color: var(--control-fill);
}

.box > input[type=checkbox] {
    display: block;
    margin: 1em auto;
    transform: scale(1.8);
}

.caption {
    font-size: smaller;
    color: var(--body-focus);
}

.caption a {
    text-decoration: underline;
    color: inherit;
}

.caption a:focus, .caption a:hover {
    color: var(--active-text);
}

/* Ensure empty fixed-width font-awesome icons still take their fixed size. */
.fa-fw::after {
    content: " ";
    white-space: pre;
}

.fa-xs {
    vertical-align: baseline;
}

/*=================================================================
  Navigation
 *================================================================*/

#navigation {
    margin-top: -80px;
    padding: var(--join-size);
}

#navigation .container {
    border: 1px solid var(--body-fill);
    border-radius: var(--join-size);
    background: rgba(var(--body-fill-rgb), 0.9);
    box-shadow: 0 0 2px var(--body-fill);
}

#navigation .navbar-nav {
    margin-right: auto;
}

#navigation .navbar-brand {
    font: 500 1em system-ui, sans-serif;
}

#navigation .nav-item {
    border-bottom: 2px solid transparent;
    transition: all .38s ease-in 0s;
}

#navigation .nav-item:hover, #navigation .nav-item.active {
    border-bottom-color: var(--control-contrast);
}

#navigation .nav-link {
    color: var(--body-text);
}

#navigation .nav-item.active .nav-link {
    font-weight: bold;
    color: var(--active-text);
}

html #navigation .cta {
    opacity: 0;
    transition: all .38s ease-in 0s;
}

html[data-scroll]:not([data-scroll="hero"]) #navigation .cta {
    opacity: 1;
}

@supports ( (-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px)) ) {
    #navigation .container {
        background: rgba(var(--body-fill-rgb), 0.1);
        -webkit-backdrop-filter: blur(15px);
        backdrop-filter: blur(15px);
    }
}

/*=================================================================
  Footer
 *================================================================*/

#footer {
    position: relative;
    overflow: hidden;
    padding-top: 4em;
    background: #083E55;
}

#footer a {
    color: var(--body-text);
}

#footer a:hover {
    color: var(--active-text);
}

.copyright p {
    margin: 1em;
}
</style>

    <body>
        <div class="banner">
            <div class="container">
                <h4>Spectre Web fork</h4>
                <p>A modified fork of the Spectre 3.0-alpha.2 web app, changed in 2026. Not the official Spectre.</p>
                <a href="https://github.com/maxim-uvarov/spectre-web-fork" class="btn btn-transparent">Source Code</a>
            </div>
        </div>

        <section id="application">
            <div id="user" class="container" data-active="true">
                <div class="row justify-content-center">
                    <div class="col-lg-6 text-center box">
                        <i class="fa-solid fa-user-circle"></i>
                        <hr>

                        <form>
                            <p>
                                <label id="userName">
                                    <i class="fa-solid fa-fw fa-user-large"></i>
                                    Your Full Name
                                    <input type="text" placeholder="eg. Robert Lee Mitchell" autocomplete="off">
                                </label>
                            </p>

                            <p>
                                <label id="userSecret">
                                    <i class="fa-solid fa-fw fa-user-lock"></i>
                                    Your Spectre Secret
                                    <i class="fa-solid fa-fw fa-spinner fa-spin"></i>
                                    <input type="password" placeholder="eg. banana colored duckling" autocomplete="off">
                                </label>
                            </p>

                            <p>
                                <label id="algorithmVersion">
                                    <i class="fa-solid fa-fw fa-clock-rotate-left"></i>
                                    Algorithm Version
                                    <select>
                                        <option value="0">V0 (2012:03)</option>
                                        <option value="1">V1 (2012:07)</option>
                                        <option value="2">V2 (2014:09)</option>
                                        <option value="3" selected>V3 (2015:01)</option>
                                    </select>
                                </label>
                            </p>

                            <hr>
    
                            <p class="info"></p>
                            <p class="error"></p>
    
                            <p>
                                <button type="submit" id="signin">
                                    <i class="fa-solid fa-fw fa-2x fa-right-to-bracket"></i><br>
                                    Sign In
                                </button>
                            </p>
                        </form>

                        <p class="caption">Your information remains 100% offline.</p>
                    </div>
                </div>
            </div>

            <div id="site" class="container" data-active="false">
                <div class="row justify-content-center">
                    <div class="col-lg-6 text-center box">
                        <i class="fa-solid fa-globe"></i>
                        <hr>

                        <form>
                            <p>
                                <label id="siteName">
                                    <i class="fa-solid fa-fw fa-globe"></i>
                                    Password Name or Site Domain
                                    <input type="text" placeholder="eg. twitter.com">
                                </label>
                            </p>
    
                            <div class="row justify-content-center">
                                <div class="col-lg-6">
                                    <p>
                                        <label id="siteCounter">
                                            <i class="fa-solid fa-fw fa-clock-rotate-left"></i>
                                            Password Number
                                            <input type="number" placeholder="1" min="1" max="100" value="1" class="half" />
                                        </label>
                                    </p>
                                </div>
        
                                <div class="col-lg-6">
                                    <p>
                                        <label id="siteType">
                                            <i class="fa-solid fa-fw fa-key"></i>
                                            Password Type
                                            <select></select>
                                        </label>
                                    </p>
                                </div>
                            </div>

                            <hr>

                            <p>
                                <input type="radio" name="sitePurpose" id="sitePurposePassword" value="com.lyndir.masterpassword">
                                <label for="sitePurposePassword">Password</label>
                                <input type="radio" name="sitePurpose" id="sitePurposeLogin" value="com.lyndir.masterpassword.login">
                                <label for="sitePurposeLogin">Login Name</label>
                                <input type="radio" name="sitePurpose" id="sitePurposeAnswer" value="com.lyndir.masterpassword.answer">
                                <label for="sitePurposeAnswer">Security Answer</label>
                            </p>
        
                            <p>
                                <label id="siteResult">
                                    <i class="fa-solid fa-fw fa-key"></i>
                                    Result
                                    <i class="fa-solid fa-fw fa-spinner fa-spin"></i>
                                    <button type="submit" class="fa-solid fa-copy">
                                        <input class="code" value="PozoLalv0_Yelo" readonly="">
                                    </button>
                                </label>
                            </p>
                        </form>

                        <p class="info"></p>
                        <p class="error"></p>

                        <hr>

                        <p>
                            <button type="submit" id="signout">
                                <i class="fa-solid fa-fw fa-2x fa-right-from-bracket"></i><br>
                                Sign Out
                            </button>
                        </p>

                        <p class="caption">Your information remains 100% offline.</p>
                    </div>
                </div>
            </div>
        </section>

        <footer id="footer">
            <div class="container">
                <div class="row wow fadeInUp" data-wow-duration="500ms">
                    <div class="col-12 text-center">
                        <div class="copyright">
                            <p>Based on <a href="https://spectre.app/">Spectre</a>, Copyright © 2011 <a href="https://lhunath.com">Maarten Billemont</a>. Modified 2026.</p>
                        </div>
                    </div>
                </div>
            </div>
        </footer>

        <!-- Scripts -->

/**
 * spectre-types
 * =============
 *
 * This file is responsible for providing Spectre's constants and algorithm configuration.
 *
 * It creates the global `spectre` object and attaches the following properties to it:
 * `encoder`, `algorithm`, `purpose`, `class`, `feature`, `resultType`, `counter`, `templates`, `characters`, `identicons`:
 * They are used to obtain information on Spectre's range of capabilities and to communicate with the Spectre APIs.
 */

let spectre = {}
spectre.encoder = Object.freeze(new TextEncoder());
spectre.algorithm = {
    /** (2012-03-05) V0 incorrectly performed host-endian math with bytes translated into 16-bit network-endian. */
    v0: 0,
    /** (2012-07-17) V1 incorrectly sized site name fields by character count rather than byte count. */
    v1: 1,
    /** (2014-09-24) V2 incorrectly sized user name fields by character count rather than byte count. */
    v2: 2,
    /** (2015-01-15) V3 is the current version. */
    v3: 3,
};
spectre.algorithm = Object.freeze({
    ...spectre.algorithm,
    current: spectre.algorithm.v3,
    first: spectre.algorithm.v0,
    last: spectre.algorithm.v3,
});
spectre.purpose = Object.freeze({
    /** Generate a key for authentication. */
    authentication: "com.lyndir.masterpassword",
    /** Generate a name for identification. */
    identification: "com.lyndir.masterpassword.login",
    /** Generate a recovery token. */
    recovery: "com.lyndir.masterpassword.answer",
});
spectre.class = Object.freeze({
    /** Use the site key to generate a result from a template. */
    template: 1 << 4,
    /** Use the site key to encrypt and decrypt a stateful entity. */
    stateful: 1 << 5,
    /** Use the site key to derive a site-specific object. */
    derive: 1 << 6,
});
spectre.feature = Object.freeze({
    none: 0,
    /** Export the key-protected content data. */
    exportContent: 1 << 10,
    /** Never export content. */
    devicePrivate: 1 << 11,
    /** Don't use this as the primary authentication result type. */
    alternate: 1 << 12,
});
spectre.resultType = {
    /** 0: Don't produce a result */
    none: 0,

    /** 16: pg^VMAUBk5x3p%HP%i4= */
    templateMaximum: 0x0 | spectre.class.template | spectre.feature.none,
    /** 17: BiroYena8:Kixa */
    templateLong: 0x1 | spectre.class.template | spectre.feature.none,
    /** 18: BirSuj0- */
    templateMedium: 0x2 | spectre.class.template | spectre.feature.none,
    /** 19: Bir8 */
    templateShort: 0x3 | spectre.class.template | spectre.feature.none,
    /** 20: pO98MoD0 */
    templateBasic: 0x4 | spectre.class.template | spectre.feature.none,
    /** 21: 2798 */
    templatePIN: 0x5 | spectre.class.template | spectre.feature.none,
    /** 30: birsujano */
    templateName: 0xE | spectre.class.template | spectre.feature.none,
    /** 31: bir yennoquce fefi */
    templatePhrase: 0xF | spectre.class.template | spectre.feature.none,

    /** 1056: Custom saved result. */
    statePersonal: 0x0 | spectre.class.stateful | spectre.feature.exportContent,
    /** 2081: Custom saved result that should not be exported from the device. */
    stateDevice: 0x1 | spectre.class.stateful | spectre.feature.devicePrivate,

    /** 4160: Derive a unique binary key. */
    deriveKey: 0x0 | spectre.class.derive | spectre.feature.alternate,
};
spectre.resultType = Object.freeze({
    ...spectre.resultType,
    defaultPassword: spectre.resultType.templateLong,
    defaultLogin: spectre.resultType.templateName,
    defaultAnswer: spectre.resultType.templatePhrase,
});
spectre.resultName = Object.freeze({
    [spectre.resultType.templateMaximum]: "Maximum",
    [spectre.resultType.templateLong]: "Long",
    [spectre.resultType.templateMedium]: "Medium",
    [spectre.resultType.templateShort]: "Short",
    [spectre.resultType.templateBasic]: "Basic",
    [spectre.resultType.templatePIN]: "PIN",
    [spectre.resultType.templateName]: "Name",

rpose | #siteName | siteName | keyCounter | #keyContext | keyContext\n        let siteSalt = new Uint8Array(\n            keyPurposeBytes.length\n            + 4/*sizeof(uint32)*/ + siteNameBytes.length\n            + 4/*sizeof(int32)*/\n            + (keyContextBytes ? 4/*sizeof(uint32)*/ + keyContextBytes.length : 0)\n        );\n        let siteSaltView = new DataView(siteSalt.buffer, siteSalt.byteOffset, siteSalt.byteLength);\n\n        let sS = 0;\n        siteSalt.set(keyPurposeBytes, sS);\n        sS += keyPurposeBytes.length;\n\n        if (userKey.keyAlgorithm < 2) {\n            // V0, V1 incorrectly used the character length instead of the byte length.\n            siteSaltView.setUint32(sS, siteName.length, false/*big-endian*/);\n            sS += 4/*sizeof(uint32)*/;\n        } else {\n            siteSaltView.setUint32(sS, siteNameBytes.length, false/*big-endian*/);\n            sS += 4/*sizeof(uint32)*/;\n        }\n\n        siteSalt.set(siteNameBytes, sS);\n        sS += siteNameBytes.length;\n\n        siteSaltView.setInt32(sS, keyCounter, false/*big-endian*/);\n        sS += 4/*sizeof(int32)*/;\n\n        if (keyContextBytes) {\n            siteSaltView.setUint32(sS, keyContextBytes.length, false/*big-endian*/);\n            sS += 4/*sizeof(uint32)*/;\n\n            siteSalt.set(keyContextBytes, sS);\n            sS += keyContextBytes.length;\n        }\n\n        // 2. Derive site key from user key and site salt.\n        let keyData = await crypto.subtle.sign({\n            name: \"HMAC\", hash: {name: \"SHA-256\"}\n        }, userKey.keyCrypto, siteSalt)\n        return ({keyData: new Uint8Array(keyData), keyAlgorithm: userKey.keyAlgorithm})\n    } catch (e) {\n        throw e;\n    }\n});\n\nspectre.newSiteResult = Object.freeze(async(userKey, siteName,\n    resultType = spectre.resultType.defaultPassword, keyCounter = spectre.counter.default,\n    keyPurpose = spectre.purpose.authentication, keyContext = null) => {\n    console.trace(`[spectre]: result: ${siteName} (resultType=${resultType}, keyCounter=${keyCounter}, keyPurpose=${keyPurpose}, keyContext=${keyContext})`);\n\n    let resultTemplates = spectre.templates[resultType]\n    if (!resultTemplates) {\n        throw new SpectreError(\"resultType\", `Unsupported result template: ${resultType}.`);\n    }\n\n    let siteKey = await spectre.newSiteKey(userKey, siteName, keyCounter, keyPurpose, keyContext)\n    let siteKeyBytes = siteKey.keyData\n    if (siteKey.keyAlgorithm < 1) {\n        // V0 incorrectly converts bytes into 16-bit big-endian numbers.\n        let siteKeyV0Bytes = new Uint16Array(siteKeyBytes.length);\n        for (let sK = 0; sK < siteKeyV0Bytes.length; sK++) {\n            siteKeyV0Bytes[sK] = (siteKeyBytes[sK] > 127 ? 0x00ff : 0x0000) | (siteKeyBytes[sK] << 8);\n        }\n        siteKeyBytes = siteKeyV0Bytes\n    }\n\n    // key byte 0 selects the template from the available result templates.\n    let resultTemplate = resultTemplates[siteKeyBytes[0] % resultTemplates.length];\n\n    // key byte 1+ selects a character from the template's character class.\n    return resultTemplate.split(\"\").map((characterClass, rT) => {\n        let characters = spectre.characters[characterClass];\n        return characters[siteKeyBytes[rT + 1] % characters.length];\n    }).join(\"\");\n});\n\nspectre.newIdenticon = Object.freeze(async(userName, userSecret) => {\n    console.trace(`[spectre]: identicon: ${userName}`);\n\n    let key = await crypto.subtle.importKey(\"raw\", spectre.encoder.encode(userSecret), {\n        name: \"HMAC\", hash: {name: \"SHA-256\"}\n    }, false, [\"sign\"])\n    let seed = await crypto.subtle.sign(\"HMAC\", key, spectre.encoder.encode(userName))\n\n    return {\n        \"leftArm\": spectre.identicons.leftArm[seed[0] % spectre.identicons.leftArm.length],\n        \"body\": spectre.identicons.body[seed[1] % spectre.identicons.body.length],\n        \"rightArm\": spectre.identicons.rightArm[seed[2] % spectre.identicons.rightArm.length],\n        \"accessory\": spectre.identicons.accessory[seed[3] % spectre.identicons.accessory.length],\n        \"color\": spectre.identicons.accessory[seed[4] % spectre.identicons.color.length],\n    }\n});\n// =============================================================================\n// Created by Maarten Billemont on 2021-11-29.\n// Copyright (c) 2011, Maarten Billemont.\n//\n// This file is part of Spectre.\n// Spectre is free software. You can modify it under the terms of\n// the GNU General Public License, either version 3 or any later version.\n// See the LICENSE file for details or consult <http://www.gnu.org/licenses/>.\n//\n// Note: this grant does not include any rights for use of Spectre's trademarks.\n// =============================================================================\n\n\n/**\n * spectre-worker\n * ==============\n *\n * This file is responsible for implementing the Spectre web worker.\n * The worker manages a single internal Spectre user identity through requested operations.\n *\n * It listens to `onmessage` events for Spectre operation requests and posts back messages in response with the operation results.\n *\n * It attaches the following properties to the global `spectre` object:\n * `user`: It is used internally to process and track the requested operations.\n * \n * To perform an operation, send a message to the worker using any of the following inputs:\n * \n * Input:\n *  - userName:\n *      The full name of the user whose Spectre identity to derive. [invalidate?, identicon, user, site?]\n *  - userSecret:\n *      The Spectre secret of the user whose Spectre identity to derive. [identicon, user, site?]\n *  - algorithmVersion:\n *      The version of the Spectre algorithm to use for deriving the Spectre identity. [identicon, user, site?]\n *  - siteName:\n *      The site for which the user wants to derive a result. [site]\n *  - resultType:\n *      The type of result to generate. [site]\n *  - keyCounter:\n *      A linear version of the result to generate. [site]\n *  - keyPurpose:\n *      The purpose class for which this result token should be used. [site]\n *  - keyContext:\n *      The context parameter to pass into the result type for scoping the result token. [site]\n *  - invalidate:\n *      If set, wipe the currently authenticated user identity from memory. [invalidate]\n *      \n *  | Input > Operation | invalidate | identicon | user     | site     |\n *  |-------------------|------------|-----------|----------|----------|\n *  | userName          | optional   | required  | required | optional |\n *  | userSecret        |            | required  | required | optional |\n *  | algorithmVersion  |            | required  | required | optional |\n *  | siteName          |            |           |          | required |\n *  | resultType        |            |           |          | required | \n *  | keyCounter        |            |           |          | required |\n *  | keyPurpose        |            |           |          | required |\n *  | keyContext        |            |           |          | required |\n *  | invalidate        | required   |           |          |          |\n *\n * The worker will perform every operation for which the received message has input parameters present.\n * Once an operation is completed, the worker will post back the operation's results using the following outputs:\n * \n * Output:\n *  - operation:\n *      An identifier for the requested operation whose result is being returned. [invalidate, identicon, user, site]\n *  - userName:\n *      The full name of the user whose Spectre identity was involved in the operation's result. [invalidate, identicon, user, site]\n *  - userIdenticon:\n *      A graphical fingerprint for the user whose Spectre identity was involved in the operation's result. [identicon]\n *  - siteName:\n *      The site for which the result was derived. [site]\n *  - resultType:\n *      The type that was used for the site result which was derived. [site]\n *  - keyCounter:\n *      A linear version that was used for the site result which was derived. [site]\n *  - keyPurpose:\n *      The purpose class that was used for the site result which was derived. [site]\n *  - keyContext:\n *      The context parameter that was used for the site result which was derived. [site]\n *  - siteResult:\n *      The result which was derived by the Spectre algorithm from the request. [site]\n *  - error:\n *      If the operation failed, a description of what went wrong. [identicon, user, site]\n *  - cause:\n *      An identifier for the token which is related to the error that has occurred. [identicon, user, site]\n */\n\nonmessage = (msg) => {\n    if (msg.data.invalidate) {\n        let userName = spectre.user && spectre.user.userName\n        if (spectre.user && (!msg.data.userName || spectre.user.userName === msg.data.userName)) {\n            spectre.user.invalidate()\n        }\n\n        postMessage({\n            \"operation\": \"invalidate\",\n            \"userName\": userName,\n        })\n        return\n    }\n\n    if (!spectre.user || msg.data.userSecret) {\n        spectre.user = new SpectreUser(msg.data.userName, msg.data.userSecret, msg.data.algorithmVersion || spectre.algorithm.current);\n        spectre.user.identiconPromise.then(\n            identicon =>\n                postMessage({\n                    \"operation\": \"identicon\",\n                    \"userName\": spectre.user && spectre.user.userName,\n                    \"userIdenticon\": identicon,\n                }),\n            error => {\n                console.error(`[spectre]: ${error}`);\n                postMessage({\n                    \"operation\": \"identicon\",\n                    \"userName\": spectre.user.userName,\n                    \"error\": error.message,\n                    \"cause\": error.cause,\n                })\n            }\n        )\n        spectre.user.userKeyPromise.then(\n            key =>\n                postMessage({\n                    \"operation\": \"user\",\n                    \"userName\": spectre.user && spectre.user.userName,\n                }),\n            error => {\n                console.error(`[spectre]: ${error}`);\n                postMessage({\n                    \"operation\": \"user\",\n                    \"userName\": spectre.user.userName,\n                    \"error\": error.message,\n                    \"cause\": error.cause,\n                })\n            }\n        )\n    }\n\n    if (msg.data.siteName && (!msg.data.userName || spectre.user.userName === msg.data.userName)) {\n        let request = {\n            siteName: msg.data.siteName,\n            resultType: msg.data.resultType,\n            keyCounter: msg.data.keyCounter || spectre.counter.default,\n            keyPurpose: msg.data.keyPurpose || spectre.purpose.authentication,\n            keyContext: msg.data.keyContext,\n        }\n        if (!request.resultType) {\n            switch (request.keyPurpose) {\n                case spectre.purpose.authentication:\n                    request.resultType = spectre.resultType.defaultPassword;\n                    break;\n                case spectre.purpose.identification:\n                    request.resultType = spectre.resultType.defaultLogin;\n                    break;\n                case spectre.purpose.recovery:\n                    request.resultType = spectre.resultType.defaultAnswer;\n                    break;\n            }\n        }\n\n        spectre.user.result(request.siteName, request.resultType, request.keyCounter, request.keyPurpose, request.keyContext).then(\n            siteResult =>\n                postMessage({\n                    ...request,\n                    \"operation\": \"site\",\n                    \"userName\": spectre.user && spectre.user.userName,\n                    \"siteResult\": siteResult,\n                }),\n            error => {\n                console.error(`[spectre]: ${error}`);\n                postMessage({\n                    ...request,\n                    \"operation\": \"site\",\n                    \"userName\": spectre.user.userName,\n                    \"error\": error.message,\n                    \"cause\": error.cause,\n                })\n            }\n        );\n    }\n};"], {type: "application/javascript"})));
spectre.worker.onmessage = (msg) => {
    console.trace(`[spectre]: onmessage: ${msg.data.operation}`);
    if (msg.data.userName !== spectre.operations.user.userName)
        return;

    switch (msg.data.operation) {
        case 'invalidate':
            spectre.operations.user.userName = null;
            spectre.operations.user.identicon = null;
            spectre.operations.user.pending = false;
            spectre.operations.user.authenticated = false;
            spectre.operations.user.error = null;
            spectre.operations.user.cause = null;
            spectre.operations.site.pending = false;
            spectre.operations.site.error = null;
            spectre.operations.site.cause = null;
            spectre.operations.site.result = [];
            break;
        case 'identicon':
            spectre.operations.user.identicon = msg.data.userIdenticon;
            break;
        case 'user':
            spectre.operations.user.pending = false;
            spectre.operations.user.authenticated = msg.data.error === undefined;
            spectre.operations.user.error = msg.data.error;
            spectre.operations.user.cause = msg.data.cause;
            break;
        case 'site':
            spectre.operations.site.pending = false;
            spectre.operations.site.error = msg.data.error;
            spectre.operations.site.cause = msg.data.cause;
            mergeInto(spectre.operations.site.result, {
                [msg.data.siteName || ""]: {
                    [msg.data.keyPurpose || ""]: {
                        [msg.data.keyContext || ""]: msg.data.siteResult
                    }
                }
            });
            break;
    }
    
    for (const observer of spectre.observers) {
        observer()
    }
};
</script>
        <script>function spinnerBusy(element, busy) {
    element.data("spin", busy);

    if (busy) {
        element.finish().fadeIn();
    } else {
        element.finish().fadeOut();
    }
}

$(() => {
    let signOutButton = $('#signout');
    let user = $('#user');
    let userForm = user.find('form');
    let userName = user.find('#userName');
    let userNameInput = userName.find('input');
    let userSecret = user.find('#userSecret');
    let userSecretInput = userSecret.find('input');
    let userSecretSpinner = userSecret.find('.fa-spin');
    let userAlgorithm = user.find('#algorithmVersion');
    let userAlgorithmInput = userAlgorithm.find('select');
    let userMessage = user.find('p.info');
    let userError = user.find('p.error');
    let site = $('#site');
    let siteForm = site.find('form');
    let siteName = site.find('#siteName');
    let siteNameInput = siteName.find('input');
    let sitePurposeInputs = site.find('input[name="sitePurpose"]');
    let siteCounter = site.find('#siteCounter');
    let siteCounterInput = siteCounter.find('input');
    let siteType = site.find('#siteType');
    let siteTypeInput = siteType.find('select');
    let siteResult = site.find('#siteResult');
    let siteResultSpinner = siteResult.find('.fa-spin');
    let siteResultButton = siteResult.find('button');
    let siteResultInput = siteResultButton.find('input')
    let siteMessage = site.find('p.info');
    let siteError = site.find('p.error');

    for (template in spectre.templates) {
        let option = document.createElement('option');
        option.text = spectre.resultName[template];
        option.value = template;
        siteTypeInput[0].add(option);
    }
    for (option of sitePurposeInputs) {
        option.checked = option.value === spectre.purpose.authentication;
    }

    function updateDefaults() {
        userAlgorithmInput[0].value = spectre.algorithm.current;
        siteCounterInput[0].value = spectre.counter.initial;
        
        switch (sitePurposeInputs.filter(':checked')[0].value) {
            case spectre.purpose.authentication: {
                siteTypeInput[0].value = spectre.resultType.defaultPassword;
                break;
            }
            case spectre.purpose.identification: {
                siteTypeInput[0].value = spectre.resultType.defaultLogin;
                break;
            }
            case spectre.purpose.recovery: {
                siteTypeInput[0].value = spectre.resultType.defaultAnswer;
                break;
            }
        }
    }

    function updateSpectre() {
        spectre.request(
            siteNameInput[0].value,
            siteTypeInput[0].value,
            siteCounterInput[0].value,
            sitePurposeInputs.filter(':checked')[0].value,
            null //keyContext
        );
    }

    function updateView() {
        spinnerBusy(userSecretSpinner, spectre.operations.user.pending);
        spinnerBusy(siteResultSpinner, spectre.operations.site.pending);

        userNameInput.val(spectre.operations.user.userName);
        userSecretInput.val(null);
        siteResultInput.val(spectre.result(siteNameInput[0].value, sitePurposeInputs.filter(':checked')[0].value));

        if (spectre.operations.user.authenticated) {
            user.attr("data-active", false);
            site.attr("data-active", true);
            siteNameInput.focus()
        } else {
            user.attr("data-active", true);
            site.attr("data-active", false);
            userAlgorithmInput.val(spectre.algorithm.current);
            siteNameInput.val(null);
            userNameInput.focus()
        }
    }

    updateDefaults();
    spectre.observers.push(updateView);
    updateView();

    userForm.on('submit', (e) => {
        e.preventDefault();
        spectre.authenticate(userNameInput[0].value, userSecretInput[0].value, userAlgorithmInput[0].value);
    });
    siteForm.on('submit', (e) => {
        e.preventDefault()
        siteResultInput.select()
        navigator.clipboard.writeText(siteResultInput[0].value).then(() => {
            siteResultButton.attr("title", "Copied!").tooltip("_fixTitle").tooltip("show");
            setTimeout(() => {
                siteResultButton.tooltip("hide").attr("title", "Copy Password").tooltip("_fixTitle");
            }, 1000);
        });
    });

    signOutButton.on('click', () => {
        spectre.invalidate();
    });
    siteNameInput.on('input', () => {
        updateSpectre();
    });
    sitePurposeInputs.on('input', () => {
        updateDefaults();
        updateSpectre();
    });
    siteCounterInput.on('input', () => {
        updateSpectre();
    });
    siteTypeInput.on('input', () => {
        updateSpectre();
    });
});

if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
}
</script>
