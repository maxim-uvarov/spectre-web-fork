# Build the single-file page and publish it to GitHub Pages.
#
# Why: the served bytes are built here from the pushed commit, not committed
# alongside the sources. A committed docs/ folder looked like documentation
# and was rebuilt by hand after every change. To verify what the host serves,
# rebuild the reviewed commit with `nu build-single.nu` and compare dist/ to
# the two published URLs; the build is deterministic.
#
# Requires Settings > Pages > Source set to "GitHub Actions".
#
# Actions are pinned to commits, not tags. Why: a tag is mutable, so whoever
# controls it controls the build that produces the page which derives wallet
# seeds. The trailing comment names the version the commit was taken from, so
# the pin can be bumped on purpose.

name: pages

on:
  push:
    branches: [pwa-homescreen]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hustcer/setup-nu@9215c80adb545a85c419d5085b76eb6d082f49e7 # v3.27
        with:
          # Pinned: the built bytes depend on the Nushell version, and a
          # local rebuild for comparison has to match.
          version: "0.115.1"
      # The seed words test runs inside the build; node is preinstalled.
      - run: nu build-single.nu
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
